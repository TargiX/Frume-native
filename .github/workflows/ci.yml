name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, doctor, and release guards
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.13.0

      - name: Install app dependencies from lockfile
        run: npm ci --ignore-scripts=false

      - name: Install Worker dependencies from lockfile
        run: npm --prefix server ci --ignore-scripts=false

      - name: Verify repository
        run: npm run check

      - name: Enforce reviewed production dependency risk
        run: npm run security:dependencies
